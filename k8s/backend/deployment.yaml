apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: my-k8s-app
  labels:
    app: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:

      imagePullSecrets:
        - name: dockerhub-secret

      containers:
        - name: backend

          image: suriya1808/my_k8s_app:backend-v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3001

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
