# TEMPLATE ONLY — never commit real values.
# Copy this file to secret.yaml, fill in your values, then apply it:
#   cp k8s/backend/secret.example.yaml k8s/backend/secret.yaml
# secret.yaml is listed in .gitignore so it stays on your machine.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: my-k8s-app
type: Opaque

stringData:
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/my_k8s_app_db"

  JWT_SECRET: "<random-string-min-32-chars>"
  JWT_REFRESH_SECRET: "<another-random-string-min-32-chars>"

  SMTP_USER: "<your-email>@gmail.com"
  SMTP_PASS: "<gmail-app-password>"

  EMAIL_ADDRESS: "<your-email>@gmail.com"
  EMAIL_PASSWORD: "<gmail-app-password>"

  SEED_ADMIN_PASSWORD: "<admin-password>"
