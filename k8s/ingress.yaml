apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: my-k8s-app-ingress
  namespace: my-k8s-app

spec:
  ingressClassName: nginx

  rules:
    - host: my-k8s-app.local

      http:
        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: backend-service
                port:
                  number: 3001
